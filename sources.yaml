# ═════════════════════════════════════════════════════════════
#  VEILLE D'OFFRES — RÉGLAGES ET PAGES SURVEILLÉES
#  Ce fichier se modifie directement sur GitHub (icône crayon).
# ═════════════════════════════════════════════════════════════

reglages:
  modele: claude-haiku-5-5        # modèle Claude qui trie les offres
  score_minimum: 70               # en dessous de ce score (sur 100), pas d'alerte
  premier_passage_resume: true    # au 1er passage d'une source, t'envoie les offres pertinentes déjà en ligne
  max_alertes_par_passage: 15     # au-delà, les offres restantes arrivent dans un seul message

# ─────────────────────────────────────────────────────────────
#  Pages surveillées
#  • Ajouter une page : copie un bloc, change « nom » et « url ».
#  • Mettre une page en pause : actif: false
#  • « contexte » aide Claude quand la page n'indique pas le lieu.
#  • « attente » (facultatif) : secondes de plus si la page est lente à charger.
#  • Le mieux pour un site d'emploi : fais ta recherche sur le site,
#    trie par date (« les plus récentes »), puis colle l'adresse ici.
# ─────────────────────────────────────────────────────────────

